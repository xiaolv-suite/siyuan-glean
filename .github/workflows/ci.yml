name: Quality gates

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable project pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and Svelte checks
        run: pnpm check

      - name: Test suite
        run: pnpm test

      - name: Synthetic performance regression guard
        run: pnpm perf:check

      - name: Production build
        run: pnpm build

      - name: Repository hygiene
        run: git diff --check

      - name: Task ledger consistency
        run: pnpm task:ledger -- --check

      - name: Visual baseline contract
        run: pnpm visual:check

      - name: Release artifact check
        run: pnpm check:release
